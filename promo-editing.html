<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>宣传剪辑 - Jcc作品集</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary: #2563eb; --primary-light: #3b82f6; --primary-dark: #1d4ed8;
            --accent: #ec4899; --cyan: #06b6d4;
            --text-main: #1e293b; --text-secondary: #64748b;
            --text-muted: #94a3b8; --bg-main: #f8fafc; --bg-card: #ffffff;
            --border: #e2e8f0;
            --shadow: 0 4px 6px -1px rgba(0,0,0,0.07), 0 2px 4px -2px rgba(0,0,0,0.05);
            --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.08), 0 4px 6px -4px rgba(0,0,0,0.05);
            --radius: 12px;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Helvetica, Arial, sans-serif;
            background-color: var(--bg-main); color: var(--text-main); line-height: 1.7;
            min-height: 100vh; position: relative; overflow-x: hidden;
        }
        .bg-decoration {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: -1; overflow: hidden;
        }
        .bg-decoration::before {
            content: ''; position: absolute; top: -20%; right: -10%;
            width: 600px; height: 600px;
            background: radial-gradient(circle, rgba(37,99,235,0.08) 0%, transparent 70%);
            border-radius: 50%; animation: float 20s ease-in-out infinite;
        }
        .bg-decoration::after {
            content: ''; position: absolute; bottom: -15%; left: -5%;
            width: 500px; height: 500px;
            background: radial-gradient(circle, rgba(236,72,153,0.07) 0%, transparent 70%);
            border-radius: 50%; animation: float 25s ease-in-out infinite reverse;
        }
        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -30px) scale(1.05); }
            66% { transform: translate(-20px, 20px) scale(0.95); }
        }
        header {
            background: rgba(255,255,255,0.85); backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid var(--border);
            padding: 0 24px; height: 64px; display: flex; align-items: center;
            justify-content: space-between; position: sticky; top: 0; z-index: 100;
        }
        .logo {
            font-size: 20px; font-weight: 700;
            background: linear-gradient(135deg, var(--primary), var(--cyan));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text; letter-spacing: -0.5px;
        }
        nav { display: flex; gap: 8px; align-items: center; }
        nav a {
            text-decoration: none; color: var(--text-secondary); font-size: 14px;
            font-weight: 500; padding: 8px 16px; border-radius: 8px; transition: all 0.2s;
        }
        nav a:hover, nav a.active { color: var(--primary); background: rgba(37,99,235,0.08); }
        .clock { font-size: 13px; color: var(--text-muted); font-variant-numeric: tabular-nums; }
        .container { max-width: 1000px; margin: 0 auto; padding: 32px 24px 60px; }
        .page-title { text-align: center; margin-bottom: 20px; }
        .page-title h1 {
            font-size: 2.5rem;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; display: inline-block;
        }

        /* 顶部说明横幅 */
        .notice {
            text-align: center; margin: 0 auto 40px; max-width: 640px;
            color: var(--accent); font-size: 15px; font-weight: 600;
            background: rgba(236,72,153,0.08); border: 1px solid rgba(236,72,153,0.2);
            padding: 12px 20px; border-radius: 10px;
        }

        /* 微博链接卡片列表 */
        .link-grid { display: grid; grid-template-columns: 1fr; gap: 24px; }
        .link-card {
            display: block; text-decoration: none; color: inherit;
            background: linear-gradient(135deg, #fdf2f8 0%, #ffffff 55%, #eff6ff 100%);
            border: 2px solid var(--accent); border-radius: var(--radius);
            padding: 26px 28px; box-shadow: var(--shadow);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            position: relative;
        }
        .link-card:hover { transform: translateY(-5px); box-shadow: 0 16px 32px -6px rgba(236,72,153,0.35); }
        .link-badge {
            position: absolute; top: 16px; right: 16px;
            font-size: 12px; font-weight: 700; color: #fff;
            background: linear-gradient(135deg, var(--accent), #f43f5e);
            padding: 4px 14px; border-radius: 999px;
            box-shadow: 0 4px 12px rgba(236,72,153,0.35);
        }
        .link-title { font-size: 18px; font-weight: 700; color: var(--text-main); margin-bottom: 10px; }
        .link-url {
            font-size: 14px; color: var(--primary); word-break: break-all;
            background: rgba(37,99,235,0.06); border: 1px solid var(--border);
            border-radius: 8px; padding: 10px 14px; margin-bottom: 14px;
        }
        .link-go {
            display: inline-flex; align-items: center; gap: 6px;
            font-size: 14px; font-weight: 600; color: var(--accent);
        }

        .nav-buttons { display: flex; gap: 12px; margin-top: 40px; }
        .btn {
            display: inline-flex; align-items: center; gap: 6px; text-decoration: none;
            padding: 10px 22px; border-radius: 8px; font-size: 14px; font-weight: 500;
            transition: all 0.2s; border: none; cursor: pointer;
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            color: white; box-shadow: 0 4px 12px rgba(37,99,235,0.3);
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(37,99,235,0.4); }
        .btn-outline { background: transparent; color: var(--primary); border: 1.5px solid var(--primary); }
        .btn-outline:hover { background: rgba(37,99,235,0.06); transform: translateY(-2px); }
        footer { text-align: center; padding: 24px; color: var(--text-muted); font-size: 13px; border-top: 1px solid var(--border); margin-top: 20px; }
        @media (max-width: 640px) {
            header { padding: 0 16px; } .container { padding: 24px 16px 48px; }
            .nav-buttons { flex-direction: column; } .btn { justify-content: center; }
            .link-card { padding: 22px; }
        }
    </style>
</head>
<body>
<div class="bg-decoration"></div>
<header>
    <span class="logo">Jcc</span>
    <nav>
        <a href="index.html">主页</a>
        <a href="projects.html" class="active">项目展示</a>
        <a href="contact.html">联系我</a>
    </nav>
    <span class="clock" id="clock">--:--:--</span>
</header>
<div class="container">
    <div class="page-title"><h1>宣传剪辑</h1></div>

    <!-- 顶部说明 -->
    <div class="notice">请点击链接，跳转至微博界面</div>

    <!-- 两条微博链接卡片 -->
    <div class="link-grid">
        <a href="https://weibo.com/3849658397/H5wZc92Bg?from=feed#repost" target="_blank" rel="noopener noreferrer" class="link-card">
            <span class="link-badge">微博作品</span>
            <div class="link-title">宣传剪辑作品 一</div>
            <div class="link-url">https://weibo.com/3849658397/H5wZc92Bg?from=feed#repost</div>
            <span class="link-go">前往微博查看 →</span>
        </a>

        <a href="https://weibo.com/1371558617/H428LimO3?from=feed#repost" target="_blank" rel="noopener noreferrer" class="link-card">
            <span class="link-badge">微博作品</span>
            <div class="link-title">宣传剪辑作品 二</div>
            <div class="link-url">https://weibo.com/1371558617/H428LimO3?from=feed#repost</div>
            <span class="link-go">前往微博查看 →</span>
        </a>
    </div>

    <div class="nav-buttons">
        <a href="projects.html" class="btn btn-outline">← 项目列表</a>
        <a href="contact.html" class="btn btn-primary">联系我 →</a>
    </div>
</div>
<footer>Jcc Portfolio &copy; 2026</footer>

<script>
    setInterval(() => { document.getElementById('clock').innerText = new Date().toLocaleTimeString(); }, 1000);
</script>
</body>
</html>
